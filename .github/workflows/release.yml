name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: ''
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AgentHub ${{ github.ref_name }}
          releaseBody: |
            AgentHub v0.1.1 adds an isolated populated demo, native Claude-to-Codex context handoffs, complete skill-package workflows, and safe MCP JSON/TOML management.

            All history and memories stay local. AgentHub has no account, telemetry, cloud backend, automatic uploads, or automatic script/MCP execution.

            See the README and changelog for verified behavior, platform limits, and installation instructions. Packages are currently unsigned.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} --features desktop
