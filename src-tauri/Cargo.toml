[package]
name = "agenthub"
version = "0.1.0"
description = "The local control center for your AI coding agents"
edition = "2021"
license = "MIT"
rust-version = "1.94"

[lib]
name = "agenthub_core"

[[bin]]
name = "agenthub"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
sha2 = "0.10"
dirs = "6"
tauri = { version = "2", optional = true , features = [] }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dev-dependencies]
tempfile = "3"
